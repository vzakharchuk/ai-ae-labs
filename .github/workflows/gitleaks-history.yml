name: gitleaks-history

# Pre-commit хук (.githooks/pre-commit) ловить лише те, що комітиться зараз:
# - можна обійти через `git commit --no-verify`;
# - нічого не знає про коміти, зроблені до того, як хук взагалі поставили
#   (git config core.hooksPath не переїжджає з клоном — див. README).
#
# Тому окремо ганяємо gitleaks по ВСІЙ історії репозиторію на кожен push і
# вручну (workflow_dispatch). Команда — саме `gitleaks git`, а не застарілий
# `gitleaks detect` (він прихований з v8.19).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  scan-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # уся історія, не тільки останній коміт

      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Scan full git history
        run: gitleaks git --log-opts="--all" --redact --verbose
